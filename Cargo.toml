[package]
name = "git-waku"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Git worktree management CLI with symlink and copy support, editor/AI integration, and squash-merge detection"
license = "MIT"
repository = "https://github.com/Sixeight/waku"
publish = false

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
indicatif = "0.18.6"
console = "0.16.2"

[build-dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
opt-level = "s"
